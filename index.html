<script>
    let fullQuestionBank = [];
    let activeQuiz = [];
    let currentIdx = 0;
    let score = 0;
    let userAnswers = [];
    let mode = 'quiz';

    async function init() {
        try {
            const res = await fetch('quiz-data.json');
            fullQuestionBank = await res.json();
            startNewSession();
        } catch (e) {
            document.getElementById('question-text').innerText = "Error loading question bank. Please check your JSON file.";
        }
    }

    function startNewSession() {
        // Shuffle the full question bank randomly
        let shuffled = [...fullQuestionBank].sort(() => 0.5 - Math.random());
        
        // Take a dynamic batch (e.g., 10 questions, or all if fewer)
        activeQuiz = shuffled.slice(0, Math.min(10, shuffled.length));
        
        currentIdx = 0;
        score = 0;
        userAnswers = new Array(activeQuiz.length).fill(null);
        
        document.getElementById('results-view').style.display = 'none';
        document.getElementById('quiz-view').style.display = 'block';
        renderQuestion();
    }

    function setMode(newMode) {
        mode = newMode;
        document.getElementById('mode-quiz').classList.toggle('active', mode === 'quiz');
        document.getElementById('mode-learn').classList.toggle('active', mode === 'learn');
        renderQuestion();
    }

    function renderQuestion() {
        const q = activeQuiz[currentIdx];
        const total = activeQuiz.length;

        document.getElementById('question-tracker').innerText = `Question ${currentIdx + 1} of ${total}`;
        document.getElementById('score-tracker').innerText = `Score: ${score}`;
        document.getElementById('progress-bar').style.width = `${((currentIdx) / total) * 100}%`;
        document.getElementById('question-text').innerText = `${currentIdx + 1}. ${q.question}`;

        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = '';
        
        const expBox = document.getElementById('explanation-box');
        expBox.style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        const answered = userAnswers[currentIdx] !== null;

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;

            if (answered) {
                btn.disabled = true;
                if (idx === q.answer) btn.classList.add('correct');
                if (userAnswers[currentIdx] === idx && idx !== q.answer) btn.classList.add('incorrect');
            } else {
                btn.onclick = () => handleSelection(idx);
            }
            optsContainer.appendChild(btn);
        });

        if (answered && (mode === 'learn' || currentIdx === activeQuiz.length - 1)) {
            showExplanation(q, userAnswers[currentIdx]);
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('next-btn').innerText = (currentIdx === total - 1) ? "View Final Review" : "Next Question";
        }
    }

    function handleSelection(selectedIdx) {
        const q = activeQuiz[currentIdx];
        userAnswers[currentIdx] = selectedIdx;

        if (selectedIdx === q.answer) score++;

        const buttons = document.querySelectorAll('.opt-btn');
        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === q.answer) btn.classList.add('correct');
            if (idx === selectedIdx && selectedIdx !== q.answer) btn.classList.add('incorrect');
        });

        if (mode === 'learn') {
            showExplanation(q, selectedIdx);
        }

        const nextBtn = document.getElementById('next-btn');
        nextBtn.style.display = 'block';
        nextBtn.innerText = (currentIdx === activeQuiz.length - 1) ? "View Final Review" : "Next Question";
    }

    function showExplanation(q, selectedIdx) {
        const expBox = document.getElementById('explanation-box');
        const expTitle = document.getElementById('exp-title');
        const expText = document.getElementById('exp-text');

        expBox.style.display = 'block';
        if (selectedIdx === q.answer) {
            expTitle.innerText = "✓ Correct Answer";
            expTitle.style.color = "var(--correct)";
        } else {
            expTitle.innerText = `✗ Incorrect (Your answer: "${q.options[selectedIdx]}")`;
            expTitle.style.color = "var(--incorrect)";
        }
        expText.innerText = `Correct Option: "${q.options[q.answer]}"\n\nReasoning: ${q.explanation}`;
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < activeQuiz.length) {
            renderQuestion();
        } else {
            renderResults();
        }
    }

    function renderResults() {
        document.getElementById('quiz-view').style.display = 'none';
        document.getElementById('results-view').style.display = 'block';
        document.getElementById('final-score').innerText = `You Scored ${score} / ${activeQuiz.length} (${(score / activeQuiz.length * 100).toFixed(0)}%)`;

        const reviewContainer = document.getElementById('review-container');
        reviewContainer.innerHTML = '';

        activeQuiz.forEach((q, idx) => {
            const userPick = userAnswers[idx];
            const isCorrect = userPick === q.answer;

            const card = document.createElement('div');
            card.className = `review-card ${isCorrect ? 'correct-card' : 'incorrect-card'}`;
            
            card.innerHTML = `
                <span class="badge ${isCorrect ? 'badge-correct' : 'badge-incorrect'}">
                    ${isCorrect ? '✓ CORRECT' : '✗ INCORRECT'}
                </span>
                <div style="font-weight:700; margin-bottom:10px;">Q${idx + 1}: ${q.question}</div>
                <div style="font-size:14px; margin-bottom:6px;"><strong>Your Answer:</strong> ${userPick !== null ? q.options[userPick] : 'Not Attempted'}</div>
                <div style="font-size:14px; margin-bottom:10px; color: var(--correct);"><strong>Correct Answer:</strong> ${q.options[q.answer]}</div>
                <div style="background:#f8fafc; padding:12px; border-radius:6px; font-size:13px; color:#475569;">
                    <strong>Reasoning:</strong> ${q.explanation}
                </div>
            `;
            reviewContainer.appendChild(card);
        });
    }

    init();
</script>
