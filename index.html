<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Environmental Informatics Quiz</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .quiz-container { max-width: 700px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #1e3a8a; font-size: 24px; margin-bottom: 20px; text-align: center; }
        .question-box { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .question-title { font-weight: 600; font-size: 18px; margin-bottom: 15px; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { padding: 12px 15px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; text-align: left; font-size: 15px; transition: all 0.2s; }
        .option-btn:hover { background: #e2e8f0; }
        .correct { background-color: #dcfce7 !important; border-color: #22c55e !important; font-weight: bold; }
        .incorrect { background-color: #fee2e2 !important; border-color: #ef4444 !important; }
        .explanation { margin-top: 12px; padding: 10px; background: #eff6ff; border-left: 4px solid #3b82f6; font-size: 14px; display: none; }
        .nav-btn { display: block; margin: 20px auto 0; padding: 12px 24px; background: #1e3a8a; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .nav-btn:hover { background: #1d4ed8; }
        #score-container { text-align: center; display: none; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Environmental Informatics Quiz</h1>
    <div id="quiz-box">
        <div class="question-box">
            <div class="question-title" id="question-text">Loading question...</div>
            <div class="options" id="options-container"></div>
            <div class="explanation" id="explanation-box"></div>
        </div>
        <button class="nav-btn" id="next-btn" onclick="nextQuestion()" style="display:none;">Next Question</button>
    </div>
    <div id="score-container">
        <h2>Quiz Completed!</h2>
        <p id="score-text" style="font-size: 20px;"></p>
        <button class="nav-btn" onclick="restartQuiz()">Attempt Again</button>
    </div>
</div>

<script>
    let quizData = [];
    let currentIdx = 0;
    let score = 0;

    async function loadQuiz() {
        const response = await fetch('quiz-data.json');
        quizData = await response.json();
        showQuestion();
    }

    function showQuestion() {
        const q = quizData[currentIdx];
        document.getElementById('question-text').innerText = `Q${currentIdx + 1}. ${q.question}`;
        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = '';
        
        const expBox = document.getElementById('explanation-box');
        expBox.style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(btn, idx, q.answer, q.explanation);
            optsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedBtn, selectedIdx, correctIdx, explanation) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);

        if (selectedIdx === correctIdx) {
            selectedBtn.classList.add('correct');
            score++;
        } else {
            selectedBtn.classList.add('incorrect');
            buttons[correctIdx].classList.add('correct');
        }

        const expBox = document.getElementById('explanation-box');
        expBox.innerText = explanation;
        expBox.style.display = 'block';

        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            showQuestion();
        } else {
            showScore();
        }
    }

    function showScore() {
        document.getElementById('quiz-box').style.display = 'none';
        const scoreContainer = document.getElementById('score-container');
        scoreContainer.style.display = 'block';
        document.getElementById('score-text').innerText = `You scored ${score} out of ${quizData.length}!`;
    }

    function restartQuiz() {
        currentIdx = 0;
        score = 0;
        document.getElementById('score-container').style.display = 'none';
        document.getElementById('quiz-box').style.display = 'block';
        showQuestion();
    }

    loadQuiz();
</script>
</body>
</html>
